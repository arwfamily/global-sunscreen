name: Collect ingredient registers

on:
  schedule:
    - cron: "17 6 * * *"      # LNHPD refreshes daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # in-run checkpoints rebase; shallow can't
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spreadsheet reader (only used if a raw .xlsx is present)
        run: pip install --quiet pandas openpyxl

      - name: Collect Canada LNHPD
        env:
          PYTHONUNBUFFERED: "1"
          # First backfill: set BUDGET high once (or dispatch repeatedly —
          # the state file resumes either way). Daily runs need far less.
          BUDGET: ${{ github.event_name == 'workflow_dispatch' && '60000' || '4000' }}
        run: python collect_ca_lnhpd.py

      - name: Ingest any newly uploaded ARTG PDFs
        # Turns data/raw/au/pdf_in/*.pdf into data/raw/au/pdf/{ARTG_ID}.txt.
        # The PDFs themselves are downloaded by hand in a browser — TGA
        # disallows automated access — but everything after that is scripted.
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          pip install --quiet pdfplumber
          # pandas/openpyxl are NOT needed: the ARTG export lives in the repo
          # as .jsonl (git-diffable, no binary mangling). Add them back only
          # if you ever drop a raw .xlsx into data/raw/au/.
          python ingest_au_pdfs.py

      - name: Build Australia from ARTG export + manual PDFs
        # No network: reads data/raw/au/*.xlsx (official TGA "Export data")
        # and data/raw/au/pdf/{ARTG_ID}.txt (hand-saved PDF text). Safe to
        # run every time; it rebuilds canonical from whatever is in raw.
        env:
          PYTHONUNBUFFERED: "1"
        run: python collect_au_artg.py

      - name: Commit and push (always — including commits made mid-run)
        # The collectors commit their own checkpoints as they go. The first
        # version of this step said "nothing to commit" and exited 0 when a
        # checkpoint had already committed but FAILED to push — so the work
        # sat in a local commit and died with the runner. Now the step stages
        # anything new, then pushes whenever the branch is ahead of origin,
        # and fails loudly with git's actual error if it cannot.
        if: always()
        run: |
          set -o pipefail
          git config user.name "ingredients-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "collect: $(date -u +%Y-%m-%d)"
          else
            echo "no new files to stage"
          fi
          git fetch origin "$BRANCH"
          AHEAD=$(git rev-list --count "origin/$BRANCH..HEAD")
          echo "commits waiting to push: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then echo "nothing to push"; exit 0; fi
          for i in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $AHEAD commit(s)"; exit 0
            fi
            echo "push attempt $i failed - rebasing onto origin/$BRANCH"
            git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" || git rebase --abort
            sleep 5
          done
          echo "::error::could not push $AHEAD commit(s)"; exit 1
