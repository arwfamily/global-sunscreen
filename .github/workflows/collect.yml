name: Collect ingredient registers

on:
  schedule:
    - cron: "17 6 * * *"      # LNHPD refreshes daily
  workflow_dispatch:
    inputs:
      run_australia:
        description: "Rebuild Australia from the ARTG export + any new PDFs (seconds)"
        type: boolean
        default: true
      run_canada:
        description: "Walk Health Canada LNHPD (about 2 hours on a cold start)"
        type: boolean
        default: true

permissions:
  contents: write

# Backstop against two runs writing the branch at once. Within a run the
# jobs are already ordered by `needs`.
concurrency:
  group: ingredients-write
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- AUSTRALIA
  # Offline and fast: reads the TGA "Export data" file already in the repo
  # (searched for mineral sunscreens by hand, so it is scoped at source) plus
  # any hand-saved PDFs. Seconds, no network. It used to sit behind a
  # two-hour Canada walk in the same job, so a Canada failure took Australia
  # down with it and checking a newly added PDF meant waiting for Canada.
  australia:
    if: github.event_name != 'workflow_dispatch' || inputs.run_australia
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest any newly uploaded ARTG PDFs
        # data/raw/au/pdf_in/*.pdf -> data/raw/au/pdf/{ARTG_ID}.txt.
        # The PDFs are saved by hand in a browser (TGA disallows automated
        # access); everything after that is scripted.
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          pip install --quiet pdfplumber
          python ingest_au_pdfs.py

      - name: Build Australia from ARTG export + manual PDFs
        env:
          PYTHONUNBUFFERED: "1"
        run: python collect_au_artg.py

      - name: Publish
        if: always()
        run: |
          bash .github/publish.sh "collect(au): $(date -u +%Y-%m-%d)"

      - name: Safety net - upload data regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-au-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn

  # ------------------------------------------------------------------- CANADA
  # Networked and slow. Runs after Australia so the two never push at the
  # same moment; `always()` means a failed Australia build does not cancel it.
  canada:
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.run_canada)
    needs: australia
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Canada LNHPD (sunscreen scope)
        env:
          PYTHONUNBUFFERED: "1"
          # Cold start needs one big dispatch; daily top-ups need very little.
          # The state file resumes either way, so an exhausted budget is a
          # pause, not a failure.
          BUDGET: ${{ github.event_name == 'workflow_dispatch' && '60000' || '4000' }}
          # sunscreen only. CA_SCOPES=sunscreen,skincare to widen.
          CA_SCOPES: "sunscreen"
        run: python collect_ca_lnhpd.py

      # Scope is a judgement about records we already hold, so a corrected
      # rule can be applied without asking Health Canada for anything again.
      # Idempotent and offline: once the store is clean this drops nothing.
      - name: Re-apply the scope rule to the stored records
        if: always()
        run: python rescope_ca.py

      - name: Publish
        if: always()
        run: |
          bash .github/publish.sh "collect(ca): $(date -u +%Y-%m-%d)"

      - name: Safety net - upload data regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-ca-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn

