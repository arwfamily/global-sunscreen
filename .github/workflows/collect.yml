name: Collect ingredient registers

on:
  schedule:
    - cron: "17 6 * * *"      # LNHPD refreshes daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # in-run checkpoints rebase; shallow can't
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spreadsheet reader (only used if a raw .xlsx is present)
        run: pip install --quiet pandas openpyxl

      - name: Collect Canada LNHPD
        env:
          PYTHONUNBUFFERED: "1"
          # First backfill: set BUDGET high once (or dispatch repeatedly —
          # the state file resumes either way). Daily runs need far less.
          BUDGET: ${{ github.event_name == 'workflow_dispatch' && '60000' || '4000' }}
        run: python collect_ca_lnhpd.py

      - name: Ingest any newly uploaded ARTG PDFs
        # Turns data/raw/au/pdf_in/*.pdf into data/raw/au/pdf/{ARTG_ID}.txt.
        # The PDFs themselves are downloaded by hand in a browser — TGA
        # disallows automated access — but everything after that is scripted.
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          pip install --quiet pdfplumber
          # pandas/openpyxl are NOT needed: the ARTG export lives in the repo
          # as .jsonl (git-diffable, no binary mangling). Add them back only
          # if you ever drop a raw .xlsx into data/raw/au/.
          python ingest_au_pdfs.py

      - name: Build Australia from ARTG export + manual PDFs
        # No network: reads data/raw/au/*.xlsx (official TGA "Export data")
        # and data/raw/au/pdf/{ARTG_ID}.txt (hand-saved PDF text). Safe to
        # run every time; it rebuilds canonical from whatever is in raw.
        env:
          PYTHONUNBUFFERED: "1"
        run: python collect_au_artg.py

      - name: Commit and push (always — including commits made mid-run)
        # 2026-08-21 rewrite. The previous version died with
        #   "cannot rebase: You have unstaged changes"
        # because a later collector writes files after this step stages, and
        # with "fatal: no rebase in progress" because an aborted rebase was
        # never cleaned up. Three fixes, all of them things this repo has
        # actually been bitten by:
        #   - clear an interrupted rebase before touching anything;
        #   - --autostash, so files written after staging cannot block it;
        #   - push HEAD:<branch> by name, so a detached HEAD cannot strand
        #     the run's commits (that is what killed the recall repo run).
        if: always()
        run: |
          set -uo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"

          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::warning::clearing an interrupted rebase"
            git rebase --abort || git rebase --quit || true
          fi

          git config user.name  "ingredients-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "collect: $(date -u +%Y-%m-%d)"
          else
            echo "no new files to stage"
          fi

          git fetch origin "$BRANCH"
          AHEAD=$(git rev-list --count "origin/$BRANCH..HEAD")
          echo "commits waiting to push: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then echo "nothing to push"; exit 0; fi

          for i in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed $AHEAD commit(s)"; exit 0
            fi
            echo "push attempt $i failed - replaying onto origin/$BRANCH"
            git fetch origin "$BRANCH"
            if ! git rebase --autostash "origin/$BRANCH"; then
              git rebase --abort || true
              echo "::error::rebase onto origin/$BRANCH failed - conflicting history"
              break
            fi
            sleep $((i * 5))
          done
          echo "::error::could not push $AHEAD commit(s) - see the artifact below"
          exit 1

      # A persistence path that does not involve git at all. Runs even when
      # everything above failed, so a long collection run can never end with
      # its data existing nowhere.
      - name: Safety net - upload data regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn

